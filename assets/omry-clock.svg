<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">The Omry Labs visitor-time clock</title>
  <desc id="desc">A playful animated neon clock that begins ticking whenever the image is opened.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset=".52" stop-color="#12113a"/>
      <stop offset="1" stop-color="#071b2d"/>
    </linearGradient>
    <radialGradient id="dial" cx=".45" cy=".38" r=".72">
      <stop offset="0" stop-color="#182657"/>
      <stop offset=".68" stop-color="#0c1230"/>
      <stop offset="1" stop-color="#050817"/>
    </radialGradient>
    <linearGradient id="cyan-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ffbf1"/>
      <stop offset="1" stop-color="#a56cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15254a" stop-opacity=".84"/>
      <stop offset="1" stop-color="#0a1028" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panel-clip">
      <rect x="465" y="67" width="367" height="226" rx="24"/>
    </clipPath>
    <path id="orbit" d="M 385 180 A 125 125 0 1 1 135 180 A 125 125 0 1 1 385 180"/>
    <g id="minor-tick">
      <line x1="260" y1="68" x2="260" y2="77" stroke="#6976a8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="major-tick">
      <line x1="260" y1="62" x2="260" y2="82" stroke="#65fff4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    </g>
  </defs>

  <rect width="900" height="360" rx="28" fill="url(#space)"/>
  <path d="M0 278 C170 225 300 360 490 294 S770 235 900 276 V360 H0Z" fill="#121d49" opacity=".46"/>
  <path d="M0 308 C180 260 318 377 500 319 S765 276 900 305 V360 H0Z" fill="#081226" opacity=".72"/>

  <g fill="#81fff5">
    <circle cx="54" cy="61" r="1.7"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="91" cy="250" r="1.2"><animate attributeName="opacity" values="1;.15;1" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="418" cy="55" r="1.5"><animate attributeName="opacity" values=".15;.9;.15" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="438" cy="310" r="1.2"><animate attributeName="opacity" values=".8;.1;.8" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="851" cy="43" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="866" cy="321" r="1.1"><animate attributeName="opacity" values="1;.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="260" cy="180" r="139" fill="none" stroke="#263770" stroke-width="1.5" stroke-dasharray="3 8"/>
  <circle cx="260" cy="180" r="125" fill="url(#dial)" stroke="url(#cyan-violet)" stroke-width="3" filter="url(#soft-glow)"/>
  <circle cx="260" cy="180" r="113" fill="none" stroke="#8491d0" stroke-opacity=".18"/>

  <g>
    <use href="#major-tick"/>
    <use href="#minor-tick" transform="rotate(30 260 180)"/>
    <use href="#minor-tick" transform="rotate(60 260 180)"/>
    <use href="#major-tick" transform="rotate(90 260 180)"/>
    <use href="#minor-tick" transform="rotate(120 260 180)"/>
    <use href="#minor-tick" transform="rotate(150 260 180)"/>
    <use href="#major-tick" transform="rotate(180 260 180)"/>
    <use href="#minor-tick" transform="rotate(210 260 180)"/>
    <use href="#minor-tick" transform="rotate(240 260 180)"/>
    <use href="#major-tick" transform="rotate(270 260 180)"/>
    <use href="#minor-tick" transform="rotate(300 260 180)"/>
    <use href="#minor-tick" transform="rotate(330 260 180)"/>
  </g>

  <g font-family="monospace" font-size="12" font-weight="700" fill="#aab5ee" text-anchor="middle">
    <text x="260" y="103">XII</text>
    <text x="338" y="185">III</text>
    <text x="260" y="264">VI</text>
    <text x="181" y="185">IX</text>
  </g>

  <g stroke-linecap="round">
    <line x1="260" y1="180" x2="260" y2="123" stroke="#c4b4ff" stroke-width="8">
      <animateTransform attributeName="transform" type="rotate" from="304 260 180" to="664 260 180" dur="43200s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="180" x2="260" y2="93" stroke="#65fff4" stroke-width="5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="48 260 180" to="408 260 180" dur="3600s" repeatCount="indefinite"/>
    </line>
    <line x1="260" y1="195" x2="260" y2="82" stroke="#ff5ca8" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="180 260 180" to="540 260 180" dur="60s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="260" cy="180" r="9" fill="#ff5ca8" filter="url(#glow)"/>
  <circle cx="260" cy="180" r="3.5" fill="#fff"/>

  <circle r="4.5" fill="#ffde59" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit"/>
    </animateMotion>
  </circle>

  <rect x="465" y="67" width="367" height="226" rx="24" fill="url(#panel)" stroke="#5668a8" stroke-opacity=".72"/>
  <g clip-path="url(#panel-clip)">
    <path d="M485 83 H812 M485 101 H812 M485 259 H812 M485 277 H812" stroke="#88fff6" stroke-opacity=".08"/>
    <rect x="465" y="65" width="367" height="3" fill="#64fff4" opacity=".24">
      <animate attributeName="y" values="65;292;65" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".05;.34;.05" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="monospace">
    <text x="497" y="109" fill="#7485c4" font-size="12" letter-spacing="4">VISITOR-TIME / 01</text>
    <text x="497" y="158" fill="#f7f8ff" font-size="32" font-weight="800" letter-spacing="2">MAKE · SHIP</text>
    <text x="497" y="197" fill="url(#cyan-violet)" font-size="32" font-weight="800" letter-spacing="2" filter="url(#glow)">· REPEAT</text>
    <line x1="497" y1="219" x2="795" y2="219" stroke="#44558e"/>
    <circle cx="504" cy="248" r="4" fill="#65fff4" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="253" fill="#a9b5e8" font-size="13" letter-spacing="1.5">A NEW TIMELINE STARTS HERE</text>
  </g>

  <path d="M31 28 H107" stroke="#65fff4" stroke-width="2" opacity=".65"/>
  <path d="M793 332 H869" stroke="#a56cff" stroke-width="2" opacity=".65"/>
</svg>
